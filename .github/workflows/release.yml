name: Release
# انتشار: git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Check tag matches versionName
        run: |
          TAG="${GITHUB_REF_NAME}"
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VN" != "$TAG" ]; then echo "Tag $TAG does not match versionName $VN in app/build.gradle.kts"; exit 1; fi
      - name: Prepare signing key (required for releases)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret is missing: a release must be signed with the permanent key."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle testDebugUnitTest assembleRelease --no-daemon
      - name: Package release files
        run: |
          TAG="${GITHUB_REF_NAME}"
          VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          APK="hazaragi-keyboard-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "$SHA  $APK" > "$APK.sha256"
          printf '{\n  "versionName": "%s",\n  "versionCode": %s,\n  "file": "%s",\n  "sha256": "%s"\n}\n' "${TAG#v}" "$VC" "$APK" "$SHA" > version.json
          if [ -f "release-notes/${TAG}.md" ]; then cp "release-notes/${TAG}.md" body.md; else echo "نسخه ${TAG}" > body.md; fi
          printf '\n\nSHA-256: %s\n' "$SHA" >> body.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: body.md
          files: |
            hazaragi-keyboard-*.apk
            hazaragi-keyboard-*.apk.sha256
            version.json
